syntax = "proto3";

package taskmanager.v1;

option go_package = "github.com/keploy/taskmanager/proto/taskpb";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc AssignTask(AssignTaskRequest) returns (AssignResponse);
  rpc UnassignTask(UnassignTaskRequest) returns (AssignResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string user_id     = 2;
  string role        = 3;
}

message Task {
  string id          = 1;
  string title       = 2;
  string description = 3;
  string status      = 4;
  string priority    = 5;
  string due_date    = 6; // RFC3339; empty if unset
  string owner_id    = 7;
  string created_at  = 8;
  string updated_at  = 9;
  repeated string assignees = 10;
}

message CreateTaskRequest {
  string title       = 1;
  string description = 2;
  string priority    = 3;
  string due_date    = 4;
}

message GetTaskRequest { string id = 1; }

message ListTasksRequest {
  string owner_id    = 1;
  string assignee_id = 2;
  string status      = 3;
  int32  limit       = 4;
  int32  offset      = 5;
}

message ListTasksResponse { repeated Task tasks = 1; }

message UpdateTaskRequest {
  string id           = 1;
  string title        = 2;
  string description  = 3;
  string status       = 4;
  string priority     = 5;
  string due_date     = 6;
  bool   clear_due_date = 7;
}

message DeleteTaskRequest { string id = 1; }
message DeleteTaskResponse { string status = 1; }

message AssignTaskRequest {
  string task_id = 1;
  string user_id = 2;
}
message UnassignTaskRequest {
  string task_id = 1;
  string user_id = 2;
}
message AssignResponse { string status = 1; }
